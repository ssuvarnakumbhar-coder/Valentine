<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Prabha ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: rgba(0,0,0,0.2);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
    }

    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 15px;
    }

    #yes {
      background: #00ff99;
    }

    #no {
      background: #ff4d4d;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Prabha ❤️</h1>
    <p>
      Tum meri zindagi ki wo movie ho  
      jiska interval bhi skip nahi karta 😌  
      <br><br>
      Toh ek sawaal hai…
    </p>
    <h2>Will you be my Valentine? 💖</h2>

    <button id="yes" onclick="yesClicked()">YES 💕</button>
    <button id="no" onmouseover="moveNo()">NO 😜</button>
  </div>

  <script>
    function yesClicked() {
      document.body.innerHTML = `
        <div style="color:white;text-align:center;">
          <h1>YAYYYY 🥰</h1>
          <h2>Prabha, you just made me the happiest 💖</h2>
          <p>Ye Valentine sirf tumhare naam 💫</p>
        </div>
      `;
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  </script>

</body>
  </html>
